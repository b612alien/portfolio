<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>포트폴리오 파일 만들기</title><link rel="stylesheet" href="../assets/css/style.css"><style>form{max-width:900px}label{display:block;margin:20px 0}input,textarea,select{display:block;width:100%;padding:12px;border:1px solid #ddd;font:inherit;margin-top:8px}textarea{min-height:150px}.languages{display:grid;grid-template-columns:1fr 1fr;gap:24px}button{padding:12px 20px;cursor:pointer}output{display:block;white-space:pre-wrap;margin:25px 0}@media(max-width:700px){.languages{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="page-title"><h1>작품 입력.</h1><p>한국어와 영어를 각각 입력하고 작품 HTML 파일과 Works 카드 코드를 내려받습니다. 파일은 직접 프로젝트에 추가해 주세요.</p></section><form id="editor"><label>폴더명 (영문 소문자, 숫자, 하이픈)<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="my-new-project"></label><label>연도<input name="year" required value="2026" pattern="[0-9]{4}"></label><label>분류<select name="category"><option value="commercial">커머셜 / Commercial</option><option value="wedding">웨딩 / Wedding</option><option value="competition">공모전 / Competitions</option><option value="fine">파인 주얼리 / Fine Jewelry</option><option value="experimental">실험 / Experimental</option></select></label><div class="languages"><section><h2>한국어</h2><label>작품명<input name="titleKo" required></label><label>짧은 소개<input name="summaryKo" required></label><label>프로젝트 설명<textarea name="overviewKo" required></textarea></label><label>제작 과정<textarea name="processKo" required></textarea></label></section><section><h2>English</h2><label>Project title<input name="titleEn" required></label><label>Short introduction<input name="summaryEn" required></label><label>Project overview<textarea name="overviewEn" required></textarea></label><label>Design process<textarea name="processEn" required></textarea></label></section></div><button type="submit">작품 HTML + 카드 코드 다운로드</button><output id="result" role="status"></output></form><p><a class="small-link" href="../works/">작품 목록으로</a></p></main><script src="../assets/js/portfolio-editor.js" defer></script></body></html>
